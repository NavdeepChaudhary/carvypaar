name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (SQLite) + coverage
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=90
      - name: Migrations are in sync with the models
        run: alembic upgrade head && alembic check
        env: { DATABASE_URL: "sqlite:///./ci.db" }

  postgres:
    name: Migrations + smoke test on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: carvypaar }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/carvypaar
      AUCTION_WORKER_ENABLED: "false"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Upgrade, downgrade, upgrade (migrations are reversible on Postgres)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic check
      - name: Seed + query through the real API on Postgres
        run: |
          python -m app.cli seed --count 24
          python -m app.cli create-admin --email ci-admin@example.com --password 'C1-admin-pass!'
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf "localhost:8000/api/listings?make=bmw&sort=price_desc" | python -c "import sys,json; d=json.load(sys.stdin); assert d['total'] >= 0; print('listings ok', d['total'])"
          curl -sf "localhost:8000/api/auctions?tab=live" | python -c "import sys,json; print('auctions ok', json.load(sys.stdin)['total'])"
          TOKEN=$(curl -sf -H 'Content-Type: application/json' -d '{"email":"ci-admin@example.com","password":"C1-admin-pass!"}' localhost:8000/api/auth/login | python -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          curl -sf -H "Authorization: Bearer $TOKEN" localhost:8000/api/admin/stats | python -c "import sys,json; d=json.load(sys.stdin); assert len(d['daily']) == 14; print('admin stats ok')"

  ml:
    name: ML pipeline tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml/requirements.txt }
      - run: pip install -r requirements.txt
      - run: pytest
      - name: scikit-learn pins match (pickled model compatibility)
        run: |
          a=$(grep -E '^scikit-learn==' requirements.txt); b=$(grep -E '^scikit-learn==' ../backend/requirements.txt)
          test "$a" = "$b" || { echo "ml: $a  backend: $b"; exit 1; }

  frontend:
    name: Frontend typecheck, unit tests, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt -r ml/requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm ci && npm audit --omit=dev --audit-level=high

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carvypaar-backend backend
      - run: docker build -t carvypaar-ml ml
      - run: docker build --build-arg NEXT_PUBLIC_API_URL=https://example.com -t carvypaar-frontend frontend
      - name: Compose files are valid
        run: |
          cp .env.example .env && sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/' .env
          docker compose config --quiet
          printf 'DOMAIN=example.com\nACME_EMAIL=ci@example.com\nSECRET_KEY=%s\nPOSTGRES_PASSWORD=ci\n' "$(openssl rand -hex 32)" > .env.production
          docker compose -f docker-compose.prod.yml --env-file .env.production config --quiet
