name: Keep API awake

# Render's free plan puts the API to sleep after ~15 minutes without traffic, and
# waking it takes 30-60 s. Requests that arrive meanwhile through the Vercel proxy
# can fail with 502 (signing in showed "Request failed (502)"). Pinging the health
# check every 10 minutes keeps it awake. One always-on free service uses ~744 of
# Render's 750 free instance hours a month.
#
# GitHub runs scheduled jobs on a best-effort basis (they can start late at busy
# times) and pauses them after 60 days without repository activity, so the site
# still retries while the server wakes; this just makes that rare.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 5 https://carvypaar-api.onrender.com/api/health
