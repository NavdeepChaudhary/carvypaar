# CarVypaar full stack: PostgreSQL + FastAPI + Next.js + ML trainer
#   cp .env.example .env   (then edit secrets)
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carvypaar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-carvypaar}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: trains the price model if none exists, then exits.
  # Retrain: docker compose run --rm ml python scripts/train.py
  ml:
    build: ./ml
    volumes:
      # Named volumes (not host folders) so the non-root trainer can always write to them.
      - ml_models:/ml/models
      - ml_data:/ml/data/processed

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-carvypaar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-carvypaar}
      UPLOAD_DIR: /app/uploads
      PRICE_MODEL_PATH: /app/ml_models/price_model.joblib
      ML_DATA_DIR: /app/ml_data
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - ml_models:/app/ml_models:ro   # hot-reloaded when the ml job retrains
      - ml_data:/app/ml_data          # export-training-data writes here; train.py reads it

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the browser bundle: must be reachable from the user's browser.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
  ml_models:
  ml_data:
